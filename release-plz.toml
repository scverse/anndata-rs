# https://release-plz.dev/docs/config

[changelog]
# release-plz’s default parsers, plus skipping its own release PRs
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^feat", group = "added" },
  { message = "^changed", group = "changed" },
  { message = "^deprecated", group = "deprecated" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = "^.*", group = "other" },
]

[[package]]
name = "anndata_rs"
# not on crates.io, so take the last released version from the git tags
git_only = true
# release the Python package when the crates it bundles change (bumps at most a patch version)
changelog_include = ["pyanndata", "anndata", "anndata-hdf5"]

[[package]]
name = "pyanndata"
# not on crates.io either.
# Needs tags so old commits don’t end up in the anndata_rs changelog via `changelog_include`
git_only = true

[[package]]
name = "anndata-test-utils"
release = false
