name: Build Python distributions
# Called from ci.yml (to catch build breakage early) and release.yml (to publish)

on:
  workflow_call:

permissions: {}

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.runner }}, ${{ matrix.manylinux || matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        # Linux builds run in manylinux/musllinux containers, so the runner image doesn’t affect compatibility.
        - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
        - { runner: ubuntu-26.04-arm, target: aarch64, manylinux: auto }
        # maturin-action defaults to rust-musl-cross images for musllinux, whose CMake is too old for HDF5
        - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, container: quay.io/pypa/musllinux_1_2_x86_64 }
        - { runner: ubuntu-26.04-arm, target: aarch64, manylinux: musllinux_1_2, container: quay.io/pypa/musllinux_1_2_aarch64 }
        - { runner: windows-latest, target: x64 }
        - { runner: macos-15-intel, target: x86_64 }  # last Intel macOS image
        - { runner: macos-latest, target: aarch64 }
    steps:
    - &checkout
      name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Build abi3 wheel
      uses: PyO3/maturin-action@v1
      with:
        working-directory: python
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.manylinux }}
        container: ${{ matrix.container }}
        args: --release --generate-stubs --out dist
    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux }}
        path: python/dist

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - *checkout
    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        working-directory: python
        command: sdist
        args: --out dist
    - name: Upload sdist
      uses: actions/upload-artifact@v7
      with:
        name: dist-sdist
        path: python/dist
