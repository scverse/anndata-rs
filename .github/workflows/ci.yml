name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test_rust_code:
    runs-on: ubuntu-latest
    steps:
    - &checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - &install-rust
      name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - &cache-rust
      name: Cache rust build
      uses: Swatinem/rust-cache@v2.9.3

    - name: Test Rust package
      run: cargo test --no-fail-fast

    #- name: benchmark
    #  run: |
    #    cd ${GITHUB_WORKSPACE}/anndata-test-utils && cargo bench
    #    cd ${GITHUB_WORKSPACE}

    #- uses: actions/upload-artifact@v4
    #  with:
    #    name: benchmark
    #    path: target/criterion
 
  test_python_code:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        anndata_version: ['0.9.*', '0.10.*', '0.11.*', '0.12.*', '0.13.*']
    steps:
    - *checkout
    - *install-rust
    - *cache-rust
    - name: Build and test package
      env:
        # pip builds in release mode, which silently wraps integer overflows
        CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: true
      run: |
        pip install --user --upgrade pip
        cd ${GITHUB_WORKSPACE}/python
        pip install --user --group=test . anndata==${{ matrix.anndata_version }}
        pytest -v --durations=0 ${GITHUB_WORKSPACE}/python/tests

  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  check:
    if: always()
    needs:
    - test_rust_code
    - test_python_code
    - build
    runs-on: ubuntu-latest
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@v1.3.0
      with:
        jobs: ${{ toJSON(needs) }}
