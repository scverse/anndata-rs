[build-system]
build-backend = "maturin"
requires = [ "maturin>=1.15,<2" ]

[project]
name = "anndata-rs"
readme = "../README.md"
license = "MIT"
maintainers = [ { name = "Kai Zhang", email = "zhangkai33@westlake.edu.cn" } ]
authors = [ { name = "Kai Zhang", email = "zhangkai33@westlake.edu.cn" } ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
]
dynamic = [ "version" ]
dependencies = [
  "anndata>=0.8,<0.14",
  "hdf5plugin>=5",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "polars>=1.9,<1.32",
  "pyarrow",
  "scipy>=1.4",
]
urls.Documentation = "https://anndata-rs.readthedocs.io/"
urls.Source = "https://github.com/scverse/anndata-rs"

[dependency-groups]
test = [ "hypothesis==6.72.4", "pytest" ]
docs = [ "scverse-doc[full]>=0.6" ]

[tool.maturin]
module-name = "anndata_rs"
features = [ "extension-module" ]

[tool.ruff]
extend-ignore = [ "C408" ]
