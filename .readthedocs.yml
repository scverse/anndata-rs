# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
    rust: latest
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    build:
      html:
        - uv venv
        - uv pip install ./python --group python/pyproject.toml:docs
        - uv run sphinx-build -M html python/docs $READTHEDOCS_OUTPUT
