# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
    rust: latest
  apt_packages: [cmake] # for hdf5-metno-src
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    build:
      html:
        - uv venv
        # a release build exceeds RTD’s 15 min timeout, and autodoc only needs an importable module
        - MATURIN_PEP517_ARGS="--profile dev" CARGO_PROFILE_DEV_DEBUG=0 uv pip install ./python --group python/pyproject.toml:docs
        - uv run sphinx-build -M html python/docs $READTHEDOCS_OUTPUT
